<!doctype html>
<html lang="es" data-resolution="portrait" data-composition-variables='[
  {"id":"texto","type":"string","label":"Texto del hook (máx. 7 palabras)","default":"Esto lee bajo el agua, mira."}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="compositions/_shared.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent; /* renderizar con --format webm o mov */
      }
      body { font-family: "Poppins", sans-serif; }

      /*
        Zona segura: 10% superior libre (< 192px) y 15% inferior libre (> 1632px) — sección 7 / Fase 2.
        El hook vive en los primeros 3s, arriba del centro, sin invadir la franja de subtítulos (77% alto).
      */
      .hook-wrap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 300px;
        text-align: center;
      }

      .hook-texto {
        font-family: "Poppins", sans-serif;
        font-weight: 800;
        font-size: 76px;
        line-height: 1.12;
        color: var(--blanco);
        text-shadow:
          0 4px 0 rgba(0, 0, 0, 0.35),
          0 10px 30px rgba(0, 0, 0, 0.55);
        /* capitalización tipo oración — NO forzar mayúsculas (sección 5.1) */
      }

      .hook-underline {
        margin: 20px auto 0;
        width: 140px;
        height: 10px;
        border-radius: 6px;
        background: var(--cian);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="banner-hook"
      data-start="0"
      data-duration="3.2"
      data-width="1080"
      data-height="1920"
    >
      <div id="hook" class="clip hook-wrap" data-start="0" data-duration="3.2" data-track-index="1">
        <div class="hook-texto" id="hook-texto"></div>
        <div class="hook-underline" id="hook-underline"></div>
      </div>

      <script>
        const { texto } = window.__hyperframes.getVariables();
        const elTexto = document.getElementById("hook-texto");
        elTexto.textContent = texto;

        /*
          Ajuste automático del tamaño de letra.

          El hook ideal son <=7 palabras (sección 4.2 del plan), pero el
          automático puede traer la primera frase completa del video, que a veces
          son 12. Con 76px fijos ese texto se salía del cuadro. Se baja el tamaño
          hasta que quepa en 3 líneas — nunca se recorta la frase, porque un hook
          cortado a la mitad se lee como error justo en los 3 segundos que
          deciden la retención.

          Determinista: solo mide, no usa azar ni red (regla de Hyperframes).
        */
        const TAMANOS = [76, 68, 60, 54, 48];
        for (const px of TAMANOS) {
          elTexto.style.fontSize = px + "px";
          const maxAlto = px * 1.12 * 3 + 2;      // 3 líneas al line-height del CSS
          if (elTexto.getBoundingClientRect().height <= maxAlto) break;
        }
      </script>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          "#hook-texto",
          { opacity: 0, scale: 0.85, y: 20 },
          { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.5)" },
          0
        );
        tl.fromTo(
          "#hook-underline",
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" },
          0.2
        );
        tl.to("#hook", { opacity: 0, duration: 0.25, ease: "power1.in" }, 2.9);

        window.__timelines["banner-hook"] = tl;
      </script>
    </div>
  </body>
</html>
