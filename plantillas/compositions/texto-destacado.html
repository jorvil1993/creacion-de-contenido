<!doctype html>
<html lang="es" data-resolution="portrait" data-composition-variables='[
  {"id":"texto","type":"string","label":"Texto a destacar","default":"¡OJO A ESTO!"},
  {"id":"estilo","type":"string","label":"Estilo visual","default":"contorno"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="compositions/_shared.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent; /* renderizar con --format webm o mov */
      }
      body { font-family: "Poppins", sans-serif; }

      .texto-wrap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 360px;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .texto-box {
        font-family: "Poppins", sans-serif;
        font-weight: 800;
        font-size: 76px;
        line-height: 1.15;
        display: inline-block;
        max-width: 960px;
        word-wrap: break-word;
      }

      /* Estilo 1: contorno grueso */
      .estilo-contorno {
        color: var(--blanco);
        text-shadow:
          -4px -4px 0 #000, 4px -4px 0 #000,
          -4px 4px 0 #000, 4px 4px 0 #000,
          0 8px 24px rgba(0, 0, 0, 0.7);
        -webkit-text-stroke: 3px #000000;
      }

      /* Estilo 2: píldora sólida */
      .estilo-pildora {
        color: var(--blanco);
        background: var(--navy);
        border: 4px solid var(--cian);
        border-radius: 40px;
        padding: 16px 36px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }

      /* Estilo 3: neón / glow */
      .estilo-neon {
        color: #ffffff;
        text-shadow:
          0 0 10px var(--cian),
          0 0 20px var(--cian),
          0 0 40px var(--cian),
          0 0 80px #00e5ff,
          0 4px 10px rgba(0,0,0,0.8);
        letter-spacing: 2px;
      }

      /* Estilo 4: degradado */
      .estilo-degradado {
        background: linear-gradient(135deg, #ff007a, #ffb800);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
        font-weight: 900;
      }

      /* Estilo 5: sombra dura 3D */
      .estilo-sombra {
        color: #ffe600;
        text-shadow:
          4px 4px 0px #000000,
          8px 8px 0px rgba(0, 0, 0, 0.7),
          0 12px 30px rgba(0, 0, 0, 0.5);
        font-weight: 900;
      }

      /* Estilo 6: resaltado marcador */
      .estilo-marcador {
        background: #ffe600;
        color: #000000;
        padding: 10px 28px;
        border-radius: 6px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        transform: rotate(-1.5deg);
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="texto-destacado"
      data-start="0"
      data-duration="2.5"
      data-width="1080"
      data-height="1920"
    >
      <div id="texto-destacado-clip" class="clip texto-wrap" data-start="0" data-duration="2.5" data-track-index="1">
        <div class="texto-box estilo-contorno" id="texto-box"></div>
      </div>

      <script>
        const { texto, estilo } = window.__hyperframes.getVariables();
        const elTexto = document.getElementById("texto-box");
        elTexto.textContent = texto || "¡OJO A ESTO!";

        const estilosValidos = ["contorno", "pildora", "neon", "degradado", "sombra", "marcador"];
        const estiloClave = estilosValidos.includes(estilo) ? estilo : "contorno";
        elTexto.className = "texto-box estilo-" + estiloClave;

        const TAMANOS = [76, 68, 60, 52, 44];
        for (const px of TAMANOS) {
          elTexto.style.fontSize = px + "px";
          const maxAlto = px * 1.15 * 3 + 4;
          if (elTexto.getBoundingClientRect().height <= maxAlto) break;
        }
      </script>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          "#texto-box",
          { opacity: 0, scale: 0.7, y: 30 },
          { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" },
          0
        );
        tl.to("#texto-destacado-clip", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power1.in" }, 2.25);

        window.__timelines["texto-destacado"] = tl;
      </script>
    </div>
  </body>
</html>
