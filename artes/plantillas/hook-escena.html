<!doctype html>
<meta charset="utf-8">
<title>arte</title>
<style>
  /* Fuentes locales con rutas absolutas file:// que inyecta a1_marca.py — el
     render es headless y no hay servidor que resuelva rutas relativas. */
  @font-face { font-family: 'Poppins'; src: url('__F__/Poppins-ExtraBold.ttf'); font-weight: 800; }
  @font-face { font-family: 'Poppins'; src: url('__F__/Poppins-Bold.ttf');      font-weight: 700; }
  @font-face { font-family: 'Poppins'; src: url('__F__/Poppins-Regular.ttf');   font-weight: 400; }

  :root {
    --turquesa: #00C7CA;
    --navy: #011A2E;
    --txt: __TXT_COLOR__;
    --w: __W__px;
    --h: __H__px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--navy); }

  .lienzo {
    position: relative;
    width: var(--w); height: var(--h);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }

  /* ---- escena ---- */
  /* Fondo de estudio. Varios artes reales de Jose usan exactamente esto (el verde
     de "CLARIDAD QUE ENGANCHA", el lila de "COMODIDAD CONTROL"): degradado plano
     con el producto flotando. No necesita IA ni foto de escena. */
  .escena { position: absolute; inset: 0; background: __ESCENA__; }
  .escena .halo {
    position: absolute;
    left: 50%; top: __HALO_Y__%;
    width: 92%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, __HALO__ 0%, transparent 62%);
  }
  .escena-foto { position: absolute; inset: 0; }
  .escena-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Velo: sin esto el titular blanco compite con las zonas claras y pierde
     legibilidad. Solo cubre la franja del texto. Reforzado 2026-08-03: con
     fondos de agy/Qwen (fotorrealistas, no plantillas de color) la franja de
     arriba a veces trae ventanas, cielo o detalle brillante justo detras del
     titular -- el velo anterior (86% -> 0% a los 52%) no siempre alcanzaba. */
  .velo {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(1,26,46,.86) 0%, rgba(1,26,46,.66) 20%,
      rgba(1,26,46,.12) 40%, rgba(1,26,46,0) 52%);
  }

  /* ---- producto recortado ---- */
  /* Se dimensiona por ALTO, no por ancho: lo que decide si el producto choca
     con el titular o con la barra de confianza es cuanto alto ocupa, y los
     recortes vienen con proporciones distintas segun el modelo. */
  .producto-img {
    position: absolute;
    left: __PROD_X__%; top: __PROD_Y__%;
    transform: translate(-50%, -50%);
    height: __PROD_H__%;
    filter: drop-shadow(0 __SOMBRA__px __SOMBRA2__px rgba(0,0,0,.45));
  }
  .producto-img img { height: 100%; width: auto; display: block; }

  /* ---- callouts flotantes ---- */
  /* El arquetipo del arte "PAPERWHITE 32GB SIGNATURE" de Jose: etiquetas de
     vidrio esmerilado alrededor del aparato senalando caracteristicas.
     backdrop-filter necesita que haya algo detras que desenfocar, por eso la
     capa va despues del producto en el DOM. */
  .callout {
    position: absolute;
    transform: translate(-50%, -50%);
    background: rgba(1,26,46,.52);
    backdrop-filter: blur(__BLUR__px);
    -webkit-backdrop-filter: blur(__BLUR__px);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: __CO_RAD__px;
    padding: __CO_PY__px __CO_PX__px;
    color: #fff;
    font-weight: 700;
    font-size: __CO_F__px;
    line-height: 1.15;
    text-align: left;
    max-width: 34%;
    box-shadow: 0 __CO_S__px __CO_S2__px rgba(0,0,0,.28);
  }
  .callout .dato { display: block; font-weight: 800; color: var(--turquesa); }

  /* ---- fichas tecnicas ---- */
  /* El arquetipo del arte "PAPERWHITE 12VA GEN 32GB": lista vertical con icono
     de contorno a la izquierda, titulo en negrita y descripcion debajo.
     Aca el icono mide ~90 px y el trazo SI lee — la regla del trazo macizo
     aplica solo a los sellos, que son mucho mas chicos. */
  .fichas {
    width: __FI_W__%;
    margin-top: __FI_MT__px;
    display: flex; flex-direction: column;
    gap: __FI_GAP__px;
  }
  .fichas.vidrio {
    background: rgba(1,26,46,.58);
    backdrop-filter: blur(__BLUR__px);
    -webkit-backdrop-filter: blur(__BLUR__px);
    border: 1px solid rgba(255,255,255,.24);
    border-radius: __CO_RAD__px;
    padding: __FI_PAD__px;
  }
  .ficha { display: flex; align-items: flex-start; gap: __FI_ICOGAP__px; }
  .ficha + .ficha { border-top: 1px solid __FI_LINEA__; padding-top: __FI_GAP__px; }
  .ficha .ico {
    width: __FI_ICO__px; height: __FI_ICO__px; flex: none;
    color: __FI_COLOR__;
  }
  .ficha .ico svg { width: 100%; height: 100%; display: block; }
  .ficha .txt { min-width: 0; }
  .ficha .tit {
    display: block; font-weight: 800; font-size: __FI_TIT__px;
    color: var(--txt); line-height: 1.1;
  }
  .ficha .des {
    display: block; font-weight: 400; font-size: __FI_DES__px;
    color: var(--txt); opacity: .88; line-height: 1.25; margin-top: .22em;
  }

  /* ---- comparativa partida (antes / despues) ---- */
  /* La tercera categoria que pidio Jose: media imagen con el dolor y media con
     la solucion. Es el arquetipo de su arte "¿POR QUE NO SE LEEN IGUAL?".
     Cada mitad es una imagen generada aparte: una sola imagen partida sale
     con las dos escenas mezcladas. */
  .split { position: absolute; left: 0; right: 0; top: __SP_TOP__%; bottom: __SP_BOT__%;
           display: flex; }
  .split .mitad { position: relative; flex: 1; overflow: hidden; }
  .split .mitad img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* El lado del dolor se apaga y se enfria; el de la solucion queda calido y
     entero. La diferencia se tiene que leer antes que el texto. */
  .split .mal img { filter: grayscale(.55) brightness(.72) contrast(1.05); }
  .split .mal::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(40,10,10,.30), rgba(20,30,50,.42));
  }
  .split .sep { width: __SP_SEP__px; background: var(--turquesa); flex: none; }
  .split .chip {
    position: absolute; left: 50%; bottom: __SP_CHIPB__px;
    transform: translateX(-50%);
    padding: __SP_CHIPY__px __SP_CHIPX__px; border-radius: 999px;
    font-weight: 800; font-size: __SP_CHIPF__px; white-space: nowrap;
  }
  .split .mal .chip  { background: #C8443C; color: #fff; }
  .split .sano .chip { background: var(--turquesa); color: var(--navy); }

  /* ---- dolores resueltos ---- */
  /* Pedido de Jose (2026-08-01): en vez de caracteristicas, "como solucionamos
     puntos de dolor". Cada fila es tachado + resuelto, que es el antes/despues
     que convierte. Los dolores salen de sus chats de venta reales, no de
     suposiciones (deviceshop/DOCUMENTOS MD DE LA EMPRESA/objeciones-respuestas.md). */
  .dolores {
    width: __DO_W__%;
    margin-top: __FI_MT__px;
    display: flex; flex-direction: column; gap: __FI_GAP__px;
  }
  .dolores.vidrio {
    background: rgba(1,26,46,.58);
    backdrop-filter: blur(__BLUR__px);
    -webkit-backdrop-filter: blur(__BLUR__px);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: __CO_RAD__px;
    padding: __FI_PAD__px;
  }
  .dolor { display: flex; flex-direction: column; gap: __DO_GAP__px; }
  .dolor + .dolor { border-top: 1px solid __FI_LINEA__; padding-top: __FI_GAP__px; }
  .dolor span { display: flex; align-items: flex-start; gap: __DO_ICOGAP__px; }
  .dolor .marca {
    width: __DO_ICO__px; height: __DO_ICO__px; flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .dolor .marca svg { width: 62%; height: 62%; }
  /* El dolor va tachado y apagado; la solucion, entera y en turquesa. */
  .dolor .mal .marca { background: rgba(220,80,80,.9); }
  .dolor .mal .t { color: var(--txt); opacity: .62; text-decoration: line-through;
                   font-weight: 400; font-size: __DO_F__px; line-height: 1.25; }
  .dolor .bien .marca { background: var(--turquesa); }
  .dolor .bien .t { color: var(--txt); font-weight: 800; font-size: __DO_F__px;
                    line-height: 1.25; }

  /* ---- moldes de 2026-08-10: chat, precio y comparativa en filas ----
     Los tres son bloques ABSOLUTOS que arrancan debajo del titular
     (--bloque-top, que se pasa por arte porque depende de cuantas lineas tenga)
     y terminan justo encima del pie. No van dentro de .texto como las fichas:
     necesitan el alto completo que queda libre, no fluir bajo la bajada. */
  :root { --bloque-top: __BLOQUE_TOP__%; }
  .bloque {
    position: absolute; left: 5.5%; right: 5.5%;
    top: var(--bloque-top); bottom: calc(var(--pie) + __BLO_GAP__px);
  }

  /* Kicker: la linea chica en mayusculas encima del titular. Es lo que hace que
     el arte diga de que va antes de que la persona lea el titular entero. */
  .kicker {
    font-weight: 800; font-size: __KICK_F__px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--turquesa);
    margin-bottom: __KICK_MB__px;
  }

  /* ---- molde chat ----
     Verde y beige de WhatsApp de verdad, NO el turquesa de la casa: la gracia
     del molde es que se lea como una captura real. La marca entra por el pie. */
  .chat {
    background: #ECE5DD; border-radius: __CH_RAD__px; padding: __CH_PAD__px;
    display: flex; flex-direction: column; justify-content: center;
    gap: __CH_GAP__px;
    box-shadow: 0 __CH_S__px __CH_S2__px rgba(0,0,0,.35);
  }
  .chat .b {
    max-width: 80%; padding: __CH_BPY__px __CH_BPX__px; border-radius: __CH_BRAD__px;
    font-size: __CH_F__px; line-height: 1.32; color: #111b21; font-weight: 400;
    box-shadow: 0 1px 2px rgba(0,0,0,.16);
  }
  .chat .b b { font-weight: 700; }
  .chat .b.suya { background: #FFFFFF; align-self: flex-start; border-top-left-radius: __CH_PICO__px; }
  .chat .b.mia  { background: #D9FDD3; align-self: flex-end;   border-top-right-radius: __CH_PICO__px; }
  .chat .b .hora { display: block; text-align: right; font-size: __CH_HF__px;
                   color: #667781; margin-top: __CH_HMT__px; }

  /* ---- molde precio ---- */
  .precio { position: absolute; left: 5.5%; top: var(--bloque-top); }
  .precio .rotulo { font-weight: 700; font-size: __PR_RF__px; color: var(--txt);
                    opacity: .8; letter-spacing: .06em; text-transform: uppercase; }
  .precio .num { font-weight: 800; font-size: __PR_NF__px; color: var(--turquesa);
                 line-height: .92; letter-spacing: -.02em; }
  .precio .num small { font-size: __PR_MF__px; }
  /* La lista de "que incluye" va donde iria la barra de confianza: encima del
     pie, nunca sobre el. */
  .incluye {
    position: absolute; left: 5.5%; right: 5.5%;
    bottom: calc(var(--pie) + __BLO_GAP__px);
    background: rgba(1,26,46,.72); border: 1px solid rgba(255,255,255,.16);
    border-radius: __IN_RAD__px; padding: __IN_PY__px __IN_PX__px;
    display: flex; flex-direction: column; gap: __IN_GAP__px;
  }
  .incluye .it { display: flex; align-items: center; gap: __IN_ICOGAP__px;
                 color: #fff; font-weight: 700; font-size: __IN_F__px; }
  .incluye .tic { width: __IN_ICO__px; height: __IN_ICO__px; flex: none; border-radius: 50%;
                  background: var(--turquesa); display: flex; align-items: center;
                  justify-content: center; }
  .incluye .tic svg { width: 62%; height: 62%; }

  /* ---- molde comparativa en filas ----
     Distinto del molde `split`, que son dos FOTOS. Este es una tabla de texto:
     una fila por criterio, la columna mala en rojo y la buena en turquesa. */
  .tabla { display: flex; flex-direction: column; justify-content: space-between; }
  .tabla .cabeza, .tabla .fila { display: grid; grid-template-columns: 1fr 1fr; gap: __TB_GAP__px; }
  .tabla .chip { border-radius: 999px; text-align: center; font-weight: 800;
                 font-size: __TB_CF__px; padding: __TB_CP__px 0; letter-spacing: .04em; }
  .tabla .chip.mal  { background: #D52B1E; color: #fff; }
  .tabla .chip.bien { background: var(--turquesa); color: var(--navy); }
  .tabla .et { grid-column: 1 / -1; font-weight: 800; font-size: __TB_EF__px;
               color: var(--txt); opacity: .62; letter-spacing: .10em;
               text-transform: uppercase; margin-bottom: __TB_EMB__px; }
  .tabla .cel { border-radius: __TB_RAD__px; padding: __TB_PY__px __TB_PX__px;
                font-weight: 700; font-size: __TB_F__px; line-height: 1.24;
                display: flex; align-items: center; }
  .tabla .cel.mal  { background: rgba(213,43,30,.16); border: 1px solid rgba(255,120,110,.42); color: #ffd9d5; }
  .tabla .cel.bien { background: rgba(0,199,202,.16); border: 1px solid rgba(0,199,202,.55); color: #eafcfd; }

  /* ---- bloque de texto ---- */
  .texto { position: absolute; top: 4.6%; left: 5.5%; right: 5.5%; }
  /* Molde de solo texto (carrusel de diseño): sin producto abajo, el bloque se
     centra en el hueco libre en vez de quedar pegado arriba. __TEXTO_Y__ ya
     descuenta el alto del pie. */
  .texto.centro {
    top: __TEXTO_Y__%; transform: translateY(-50%);
  }
  .texto.centro .titular, .texto.centro .divisor,
  .texto.centro .producto, .texto.centro .bajada { max-width: 100%; }
  .texto .titular, .texto .divisor, .texto .producto, .texto .bajada {
    max-width: __TXT_MAX__%;
  }
  /* Moldes chat y comparativa: el bloque de abajo es el contenido real, el
     divisor y el nombre del producto solo le roban alto. */
  .texto.compacto .divisor,
  .texto.compacto .producto,
  .texto.compacto .bajada { display: none; }
  .titular {
    font-weight: 800; font-size: __TIT__px;
    line-height: .98; letter-spacing: -.015em;
    color: var(--txt); text-transform: uppercase;
    text-shadow: __TIT_SOMBRA__;
  }
  .titular .acento { color: var(--turquesa); }

  /* Linea divisoria turquesa entre titular y producto: aparece en la mayoria
     de los artes de Jose. */
  .divisor { height: 3px; width: 46%; background: var(--turquesa); margin: 3.2% 0 2.8%; border-radius: 2px; }

  .producto { font-weight: 700; font-size: __SUB__px; color: var(--txt); line-height: 1.18; }
  .bajada   { font-weight: 400; font-size: __SUB__px; color: var(--txt); line-height: 1.25; opacity: .95; }

  /* ---- sello de confianza ---- */
  .sello {
    position: absolute; top: 4.4%; right: 5%;
    width: __SELLO_PX__px; height: __SELLO_PX__px; border-radius: 50%;
    overflow: hidden;
    background: var(--turquesa); color: var(--navy);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; line-height: 1;
    box-shadow: 0 6px 24px rgba(0,0,0,.3);
    padding: 3%;
  }
  .sello .num { font-weight: 800; font-size: __SELLO_N__px; flex: none; }
  .sello .lab { font-weight: 700; font-size: __SELLO_L__px; margin-top: .24em; line-height: 1.12; flex: none; }
  .sello .ico { width: 64%; margin-bottom: .22em; flex: none; }
  .sello .ico svg { width: 100%; height: auto; display: block; }
  /* Bandera de Bolivia en SVG y no emoji: el Chrome del render no siempre trae
     fuente de emoji a color instalada y saldria en blanco. Mismo criterio que
     ya se tomo en plantillas/compositions/stickers.html. */
  .sello .bandera { width: 42%; margin-top: .34em; flex: none; border-radius: 3px; overflow: hidden;
                    box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .sello .bandera svg { width: 100%; height: auto; display: block; }

  /* ---- barra de confianza ---- */
  /* Va por encima del pie, no encima: el CTA es mas alto de lo que parece y
     tapaba el tercer item. */
  .confianza {
    position: absolute; left: 0; right: 0; bottom: calc(var(--pie) + __CONF_GAP__px);
    background: rgba(1,26,46,.9);
    padding: __CONF_P__px 5.5%;
    display: flex; justify-content: space-between; align-items: center; gap: 3%;
  }
  .confianza span {
    color: #fff; font-weight: 700; font-size: __CONF_F__px;
    display: flex; align-items: center; gap: .45em; white-space: nowrap;
  }
  .confianza .tic {
    width: __TIC__px; height: __TIC__px; flex: none; border-radius: 50%;
    background: var(--turquesa); display: flex; align-items: center; justify-content: center;
  }
  .confianza .tic svg { width: 62%; height: 62%; }

  /* ---- pie: logo (izq) + CTA WhatsApp (der) ---- */
  /* Fijo en los 36 artes auditados: logo abajo-izquierda, CTA abajo-derecha.
     Los dos comparten ALTO y linea base — antes el CTA sobresalia y se metia
     dentro de la franja de confianza. Ese alto (--pie) es tambien el que usa la
     franja para saber donde empezar, asi que no se pueden pisar. */
  :root { --pie: __PIE__px; }

  .logo-caja {
    position: absolute; left: 0; bottom: 0;
    height: var(--pie);
    background: var(--turquesa);
    border-top-right-radius: __RAD__px;
    padding: 0 __LOGO_PR__px 0 3.0%;
    display: flex; align-items: center;
  }
  .logo-caja img { height: __LOGO_H__px; display: block; }

  .cta {
    position: absolute; right: 4.2%; bottom: 0;
    height: var(--pie);
    display: flex; flex-direction: column;
    align-items: stretch; justify-content: center; gap: __CTA_G__px;
  }
  .cta .fila {
    background: var(--turquesa); border-radius: 999px;
    padding: __CTA_P__px __CTA_PX__px;
    display: flex; align-items: center; justify-content: center; gap: .5em;
  }
  .cta .fila.oscura { background: var(--navy); }
  .cta .fila svg { width: __WA__px; height: __WA__px; flex: none; }
  .cta .txt { font-weight: 700; font-size: __CTA_F__px; color: var(--navy); letter-spacing: .02em; }
  .cta .num { font-weight: 800; font-size: __NUM_F__px; color: #fff; }
</style>

<div class="lienzo">
  __CAPA_FONDO__
  __CAPA_PRODUCTO__
  __CALLOUTS__
  __SPLIT__

  <div class="__TEXTO_CLASE__">
    __KICKER__
    <div class="titular">__TITULAR__</div>
    <div class="divisor"></div>
    <div class="producto">__PRODUCTO__</div>
    <div class="bajada">__BAJADA__</div>
    __FICHAS__
    __DOLORES__
  </div>

  __CHAT__
  __PRECIO__
  __FILAS__
  __INCLUYE__

  __SELLO__

  __CONFIANZA__

  <div class="logo-caja"><img src="__LOGO__" alt="Device Shop BO"></div>

  __CTA__
</div>
